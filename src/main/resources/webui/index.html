<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --bg: #070b12;
    --panel: #0d141f;
    --panel-edge: #16202f;
    --text: #d7e2ee;
    --dim: #6b7c90;
    --cyan: #35c9f0;
    --cyan-soft: rgba(53, 201, 240, 0.12);
    --gold: #d9a441;
    --red: #e05555;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #0d1a2b 0%, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    padding: 28px 20px 60px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .reactor {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 18px rgba(53,201,240,.55), inset 0 0 12px rgba(53,201,240,.45);
    position: relative; flex: none;
    transition: all .3s;
  }
  .reactor::after {
    content: ""; position: absolute; inset: 9px; border-radius: 50%;
    background: var(--cyan); opacity: .85; filter: blur(1px);
    transition: all .3s;
  }
  .off .reactor { border-color: #3a4656; box-shadow: none; }
  .off .reactor::after { background: #3a4656; opacity: .5; }
  h1 { font-size: 21px; letter-spacing: .35em; font-weight: 600; }
  .sub { color: var(--dim); font-size: 12.5px; letter-spacing: .12em; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 18px;
  }
  .card h2 {
    font-size: 11.5px; font-weight: 600; letter-spacing: .22em;
    color: var(--dim); text-transform: uppercase; margin-bottom: 14px;
  }
  .full { grid-column: 1 / -1; }

  /* listening toggle */
  .listenrow { display: flex; align-items: center; justify-content: space-between; }
  .listenstate { font-size: 17px; font-weight: 600; }
  .listenstate small { display: block; font-weight: 400; color: var(--dim); font-size: 12.5px; }
  .switch {
    width: 58px; height: 30px; border-radius: 15px; border: 1px solid var(--panel-edge);
    background: #1a2432; cursor: pointer; position: relative; transition: background .25s; flex: none;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 4px; width: 22px; height: 22px;
    border-radius: 50%; background: #55677d; transition: all .25s;
  }
  .switch.on { background: var(--cyan-soft); border-color: var(--cyan); }
  .switch.on::after { left: 30px; background: var(--cyan); box-shadow: 0 0 10px rgba(53,201,240,.8); }

  /* voices */
  .voices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .voice {
    border: 1px solid var(--panel-edge); border-radius: 10px; padding: 12px;
    cursor: pointer; transition: all .15s; background: #101927;
  }
  .voice:hover { border-color: var(--cyan); }
  .voice.active { border-color: var(--cyan); background: var(--cyan-soft); }
  .voice b { display: block; font-size: 14.5px; }
  .voice span { color: var(--dim); font-size: 12px; }
  .voice.active b { color: var(--cyan); }

  /* persona */
  textarea {
    width: 100%; min-height: 170px; resize: vertical;
    background: #0a1220; color: var(--text);
    border: 1px solid var(--panel-edge); border-radius: 10px;
    padding: 12px; font: 12.5px/1.55 var(--mono);
  }
  textarea:focus { outline: none; border-color: var(--cyan); }
  .row { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
  button {
    background: var(--cyan-soft); color: var(--cyan);
    border: 1px solid var(--cyan); border-radius: 8px;
    padding: 8px 18px; font-size: 13.5px; cursor: pointer; transition: all .15s;
  }
  button:hover { background: rgba(53,201,240,.25); }
  button:disabled { opacity: .4; cursor: default; }
  .hint { color: var(--dim); font-size: 12px; }
  .saved { color: var(--gold); font-size: 12.5px; opacity: 0; transition: opacity .3s; }
  .saved.show { opacity: 1; }

  /* feed */
  .feed {
    font: 12px/1.7 var(--mono); color: #9fb2c6;
    max-height: 260px; overflow-y: auto; white-space: pre-wrap;
  }
  .feed .say { color: var(--cyan); }
  .feed .heard { color: var(--gold); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .chip {
    font-size: 11.5px; letter-spacing: .06em; color: var(--dim);
    border: 1px solid var(--panel-edge); border-radius: 999px; padding: 4px 12px;
  }
  .chip b { color: var(--text); font-weight: 500; }
  .chip.err b { color: var(--red); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="reactor"></div>
    <div>
      <h1>J.A.R.V.I.S.</h1>
      <div class="sub">LOCAL CONTROL &mdash; THIS MACHINE ONLY</div>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>Microphone</h2>
      <div class="listenrow">
        <div class="listenstate">
          <span id="listenLabel">&mdash;</span>
          <small id="listenHint"></small>
        </div>
        <div class="switch" id="listenSwitch" title="Toggle listening"></div>
      </div>
    </div>

    <div class="card">
      <h2>Voice</h2>
      <div class="voices" id="voices"></div>
    </div>

    <div class="card full">
      <h2>Personality</h2>
      <textarea id="persona" spellcheck="false"></textarea>
      <div class="row">
        <button id="savePersona">Save personality</button>
        <span class="saved" id="personaSaved">Saved &mdash; applies to the next thing you say</span>
      </div>
      <div class="row"><span class="hint">This is the system prompt. Edit freely; it is spoken behaviour, tone and rules in plain English.</span></div>
    </div>

    <div class="card full">
      <h2>Activity</h2>
      <div class="feed" id="feed">Waiting for Jarvis&hellip;</div>
    </div>
  </div>

  <div class="chips" id="chips"></div>
</div>

<script>
const VOICES = [
  { id: "bm_george", label: "George", desc: "measured, formal" },
  { id: "bm_lewis",  label: "Lewis",  desc: "warmer, softer" },
  { id: "bm_daniel", label: "Daniel", desc: "brighter, younger" },
  { id: "bm_fable",  label: "Fable",  desc: "storyteller" },
];
let state = { listening: null, voice: null };
let personaLoaded = false;

const el = id => document.getElementById(id);

async function api(path, body) {
  const opts = body ? { method: "POST", body: JSON.stringify(body) } : {};
  const r = await fetch(path, opts);
  return r.json();
}

function renderVoices() {
  el("voices").innerHTML = VOICES.map(v =>
    `<div class="voice ${state.voice === v.id ? "active" : ""}" data-id="${v.id}">
       <b>${v.label}</b><span>${v.desc}${state.voice === v.id ? " &mdash; current" : ""}</span>
     </div>`).join("");
  document.querySelectorAll(".voice").forEach(node =>
    node.onclick = async () => {
      if (node.dataset.id === state.voice) return;
      node.style.opacity = .5;
      await api("/api/voice", { name: node.dataset.id });
    });
}

function render(s) {
  state = s;
  document.body.classList.toggle("off", !s.listening);
  el("listenLabel").textContent = s.listening ? "Listening" : "Not listening";
  el("listenHint").textContent = s.listening
    ? "Say the wake word or clap to talk" : "Deaf until switched back on";
  el("listenSwitch").classList.toggle("on", s.listening);
  renderVoices();

  if (!personaLoaded && s.persona) {
    el("persona").value = s.persona;
    personaLoaded = true;
  }

  const feed = el("feed");
  const atBottom = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 8;
  feed.innerHTML = (s.recent && s.recent.length)
    ? s.recent.map(l => {
        const cls = l.includes("Jarvis: ") ? "say" : (l.includes("Heard: ") ? "heard" : "");
        return `<div class="${cls}">${l.replace(/</g, "&lt;")}</div>`;
      }).join("")
    : "Nothing yet this session.";
  if (atBottom) feed.scrollTop = feed.scrollHeight;

  el("chips").innerHTML =
    `<span class="chip">Brain <b>${s.brain}</b></span>` +
    `<span class="chip ${s.spotify ? "" : "err"}">Spotify <b>${s.spotify ? "connected" : "not connected"}</b></span>` +
    `<span class="chip">Voice engine <b>Kokoro (offline)</b></span>`;
}

el("listenSwitch").onclick = () => api("/api/listening", { enabled: !state.listening });

el("savePersona").onclick = async () => {
  const r = await api("/api/persona", { text: el("persona").value });
  if (r.ok) {
    el("personaSaved").classList.add("show");
    setTimeout(() => el("personaSaved").classList.remove("show"), 2500);
  }
};

async function poll() {
  try { render(await api("/api/status")); }
  catch (e) { el("listenLabel").textContent = "Jarvis offline"; }
}
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
